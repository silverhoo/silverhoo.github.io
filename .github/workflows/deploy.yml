# main 에 푸시되면 저장소의 정적 파일을 그대로 GitHub Pages 에 배포한다.
# 변환·페이지 생성은 맥 쪽에서 미리 끝내므로 여기서는 빌드가 없다.
# 저장소 Settings → Environments → github-pages 에 필수 검토자를 걸어 두면
# 이 워크플로의 deploy 잡이 승인 전까지 멈춘다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
