sections:
  - id: work
    title: 작업
    lead: 학교와 팀에서 한 디자인 프로젝트입니다. 각 항목에 걸린 파일은 그 프로젝트의 회고 덱입니다.
    entries:
      - base: sdfhoego
        title: UNIST 정신건강 향상을 위한 서비스 재디자인
        kicker: 서비스 디자인
        year: "2026"
        meta: 팀 프로젝트
        goal: 고위험군 학생이 UNIST 정신건강 서비스에서 제때 치료를 받지 못하는 구조적 문제를 서비스 디자인 관점에서 재구조화했습니다.
        steps: 1차 리서치 · 2차 리서치 · 문제 정의 · 최종 솔루션
      - base: raihoego
        title: Nest Guide AI — 책임 있는 AI 재디자인
        kicker: Responsible AI
        year: "2026"
        meta: 팀 프로젝트
        goal: 육아 AI 서비스를, AI의 개입이 부모의 판단 주체성을 해치지 않는 방향으로 재디자인했습니다.
        steps: 데스크 리서치 · 초기 디자인 · 유저스터디 · 최종 제안
      - base: uxdrmhoego
        title: Anker — 여행용 파워 키트의 새 제안
        kicker: UX Design Research Method
        year: "2026"
        meta: 팀 프로젝트
        goal: Anker 브랜드의 여행용 전원 키트에서 새로운 제안을 찾았습니다.
        steps: 데스크 리서치 · 유저스터디 · 아이데이션 · 프로토타입 · 마무리
      - base: aixdhoego
        title: 상향 비교를 상향 동화로 — SNS 알고리즘과 UI 전략
        kicker: AIXD
        year: "2026"
        meta: 팀 프로젝트
        goal: SNS의 상향 비교에서 상향 대조가 나타나는 것을 막고 상향 동화로 이어지도록, 알고리즘과 UI 기반 전략을 탐색했습니다.
        steps: 데스크 리서치 · 유저스터디 · 문제 정의 · 프로토타입 · 마무리
      # ↓ 목표 문장은 덱 표지가 아직 비어 있다("목표 문장 작성 대기"). 아래는 덱 내용에서 뽑은 초안.
      - base: bts
        title: BTS — 울산시 순환 대시보드
        kicker: 대시보드 디자인
        year: "2026"
        meta: 팀 프로젝트
        goal: 울산시 주무관과 그린업 인터뷰에서 얻은 니즈를 IA로 옮기고, 순환 지표를 읽는 대시보드로 만들었습니다.
        steps: 데스크 리서치 · 데이터 분석 · 유저스터디 · IA 디자인 · 대시보드 디자인

  - id: retro
    title: 회고
    lead: 위 프로젝트들을 같은 기준으로 다시 보고, 제 프로세스를 처음부터 다시 적은 종합 회고입니다.
    entries:
      - base: peurojekteu-hoego-mit-ironseo
        title: 서비스·경험디자인 이론서
        kicker: 학습 정리 · 프로젝트 분석 · 종합 회고
        year: "2026.09"
        meta: 개인
        goal: 이론서 한 권을 다섯 단계로 정리했습니다. 각 단계 끝에서 제가 한 다섯 프로젝트를 같은 기준으로 다시 봤고, 마지막에 제 프로세스를 처음부터 다시 적었습니다.
        steps: 발견하기 · 정의하기 · 개발하기 · 전달하기 · 종합 회고

# 관심사 — 2026-10-19 관심사 지도(FigJam 「개념 구조도」 '내 관심사 영역들')의 구조화 판에서 옮김. 으누 확인 전 초안.
interests:
  lead: "AI와 맥락을 맞추고, 자료를 이해하고, 그 이해를 형식지로 남겨 받는 사람에 맞춰 전하는 과정을 디자인하고 싶습니다. 그 과정이 창의적인 결과물로 이어지고, 창의적인 사람을 기르는 교육에 쓰이게 하는 것이 목표입니다."
  groups:
    - title: AI와 함께 이해하고 형식지로 남기기
      areas:
        - name: 사람과 AI, 의도와 맥락 맞추기
          text: AI가 제 의도와 맥락을 알도록, 말로 하지 않던 맥락을 프롬프트와 배경 자료로 나누는 일입니다.
          term: grounding · gulf of envisioning
        - name: 자료를 찾고 이해하기
          text: AI로 자료를 찾아 읽은 뒤, 더 깊이 이해할지 넓혀서 확장할지 정하는 일입니다.
          term: sensemaking
        - name: 암묵지를 형식지로 바꾸기
          text: 이해한 것과 경험을 다른 사람이 쓸 수 있는 글과 양식으로 남기는 일입니다. 연구적 글쓰기가 여기에 속합니다.
          term: externalization
    - title: 받는 사람과 배우는 사람
      areas:
        - name: 받는 사람에 맞춰 전하기
          text: 받는 사람의 시간, 전문성, 목적에 맞춰 같은 내용을 요약, 설명, 보고서, 영상으로 바꾸는 일입니다.
          term: audience design · multiple representations
        - name: 창의성을 위한 교육
          text: AI를 쓰며 배울 때 무엇을 AI에게 맡기고 무엇을 사람이 할지, 문제를 세우는 힘을 어떻게 기를지 봅니다.
    - title: 창의성과 디자인 프로세스
      areas:
        - name: 창의성
          text: 창의성을 문제를 세우는 일과 문제를 푸는 일로 나누어 보고, AI가 각각에 어떤 영향을 주는지 문헌으로 정리하고 있습니다.
          term: problem setting · problem solving
        - name: 디자인 프로세스와 디자인 연구
          text: 디자인 프로세스를 창의성을 키우는 틀로 보고, 프로젝트를 회고해 가이드라인과 프레임워크로 남기는 데 관심이 있습니다.
          term: double diamond · research through design
    - title: 사람의 바탕, 동기
      areas:
        - name: 동기와 웰빙
          text: 자율성, 유능성, 관계성이 배움과 AI를 쓰는 경험에 어떻게 작용하는지 봅니다.
          term: self-determination theory
  links:
    - label: 형식지로 바꾼 암묵지가 AI의 맥락이 됩니다.
      work: 작업 원칙과 문체 규칙을 md 파일로 적어 두고 AI와 일합니다.
    - label: 이해한 것을 2차 자료로 남깁니다.
      work: 읽은 자료를 절마다 아홉 칸으로 정리하는 학습 단위 양식을 만들었습니다.
    - label: 형식지를 받는 사람에 맞게 바꿉니다.
      work: 이론서 회고 덱을, 읽을 곳을 짚어 넘기는 영상으로 다시 만들었습니다.
    - label: 이해를 넓히면 창의적인 과정이 됩니다.
      work: 도메인을 배우는 일에서 문제를 정의하는 일까지 가는 절차를 정리했습니다.
    - label: 결과물이 왜 나왔고 무엇이 의미 있는지 남깁니다.
      work: 다섯 프로젝트를 회고하고 통합 이론서로 묶었습니다.
      href: "#retro"
    - label: AI에게 맡길 것과 사람이 할 것을 나눕니다.
      work: AI를 활용한 창의력 교육 15곳을 'AI가 생각을 대신하는가, 넓히는가'로 비교했습니다.

# 소개 — 2026-10-19 입니다체로 바꾸고 셋째 문단을 고침. 으누 확인 전 초안.
about:
  - 서비스·경험 디자인을 공부하고 있습니다. 팀 프로젝트를 하고, 끝난 뒤에 그 프로젝트를 같은 기준으로 다시 봅니다.
  - 다섯 프로젝트를 각각 회고한 뒤 서비스·경험디자인 이론서를 끝까지 읽었고, 그 둘을 겹쳐 앞으로 밟을 절차를 열한 장으로 다시 적었습니다. 이 사이트에 있는 덱들이 그 기록입니다.
  - 회고를 마치고 두 가지가 궁금해졌습니다. 데스크 리서치를 구조적으로 하면서 AI로 학습의 효율을 얼마나 높일 수 있을지, 그리고 가이드라인을 따르는 데서 그치지 않고 창의적인 결과물을 어떻게 낼 수 있을지입니다. 지금은 이 두 물음을 관심사 섹션에 적은 주제로 이어 공부하고 있습니다.
  - email: silverhoo@unist.ac.kr

