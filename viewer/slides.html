<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슬라이드</title>
<meta name="robots" content="noindex">
<style>
/* 슬라이드 뷰어 — 덱을 한 장씩 넘겨 본다.
   판을 보는 화면이라 테마와 무관하게 어두운 판으로 고정한다(덱의 반전 팔레트). */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{ --bg:#17191B; --ink:#FFFFFF; --lite:#B4BABF; --dim:#6B737A; --rule:#3A4045;
  --sans:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-weight:500;
  display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased;
  word-break:keep-all}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

.bar{flex:none; display:flex; align-items:center; gap:18px; height:52px; padding:0 18px;
  border-bottom:1px solid var(--rule); font-size:13px}
.bar .back{color:var(--dim); font-weight:700; letter-spacing:.06em; white-space:nowrap}
.bar .back:hover{color:var(--ink)}
.bar .ttl{flex:1; min-width:0; font-size:14px; font-weight:700; letter-spacing:-.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar .num{color:var(--lite); font-variant-numeric:tabular-nums; white-space:nowrap; letter-spacing:.02em}
.bar .dl{color:var(--dim); font-weight:700; border-bottom:1px solid var(--rule); white-space:nowrap}
.bar .dl:hover{color:var(--ink); border-bottom-color:var(--ink)}

.stage{flex:1; position:relative; display:flex; align-items:center; justify-content:center;
  padding:22px; min-height:0}
.slide{position:relative; background:#FFF; border:1px solid var(--rule); max-width:100%; max-height:100%}
.slide canvas{display:block; width:100%; height:100%}
.msg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; color:var(--dim); pointer-events:none}

.zone{position:absolute; top:0; bottom:0; width:26%; border:0; background:none; cursor:pointer;
  display:flex; align-items:center; padding:0 20px; color:var(--dim)}
.zone:hover{color:var(--ink)}
.zone.prev{left:0; justify-content:flex-start}
.zone.next{right:0; justify-content:flex-end}
.zone svg{width:22px; height:22px; opacity:.65}
.zone:hover svg{opacity:1}
.zone[disabled]{opacity:.2; cursor:default}

.rail{flex:none; height:2px; background:var(--rule)}
.rail i{display:block; height:100%; background:var(--ink); width:0; transition:width .18s ease}
@media (prefers-reduced-motion:reduce){ .rail i{transition:none} }
@media (max-width:640px){
  .bar{gap:12px; padding:0 12px; height:48px}
  .bar .ttl{font-size:13px}
  .bar .back span,.bar .dl span{display:none}
  .stage{padding:10px}
  .zone{width:32%; padding:0 8px}
}
</style>
</head>
<body>
<div class="bar">
  <a class="back" id="back" href="../index.html">←<span> 돌아가기</span></a>
  <div class="ttl" id="ttl">슬라이드</div>
  <div class="num" id="num"></div>
  <a class="dl" id="dl" href="#" download hidden>원본<span> PDF</span></a>
</div>

<div class="stage" id="stage">
  <div class="slide" id="slide"><canvas id="cv"></canvas></div>
  <div class="msg" id="msg">불러오는 중…</div>
  <button class="zone prev" id="prev" type="button" aria-label="이전 장">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg>
  </button>
  <button class="zone next" id="next" type="button" aria-label="다음 장">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 5 L16 12 L9 19"/></svg>
  </button>
</div>
<div class="rail"><i id="rail"></i></div>

<script type="module">
import * as pdfjsLib from './pdfjs/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.min.mjs';

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const f = q.get('f'), t = q.get('t'), o = q.get('o'), p = q.get('p');
const stage = $('stage'), slide = $('slide'), cv = $('cv'), msg = $('msg');

if (t) { $('ttl').textContent = t; document.title = t; }
if (p) $('back').href = p;
if (o) { $('dl').href = o; $('dl').hidden = false; }

const sameOrigin = (u) => { try { return new URL(u, location.href).origin === location.origin; } catch { return false; } };
if (!f || !sameOrigin(f)) { msg.textContent = '열 파일이 지정되지 않았다.'; }
else start(new URL(f, location.href).href);

async function start(url) {
  let pdf;
  try {
    const abs = (s) => new URL(s, location.href).href;
    const task = pdfjsLib.getDocument({
      url,
      cMapUrl: abs('./pdfjs/cmaps/'), cMapPacked: true,
      standardFontDataUrl: abs('./pdfjs/standard_fonts/'),
      wasmUrl: abs('./pdfjs/wasm/'), iccUrl: abs('./pdfjs/iccs/'),
    });
    task.onProgress = ({ loaded, total }) => {
      if (total) msg.textContent = '불러오는 중… ' + Math.round(loaded / total * 100) + '%';
    };
    pdf = await task.promise;
  } catch (e) {
    msg.textContent = '파일을 열지 못했다: ' + (e && e.message ? e.message : e);
    return;
  }

  const total = pdf.numPages;
  const first = await pdf.getPage(1);
  const base = first.getViewport({ scale: 1 });
  const ratio = base.width / base.height;
  slide.style.aspectRatio = base.width + ' / ' + base.height;

  let cur = 1, token = 0;
  const cache = new Map();                    // page -> {canvas, w}

  function fit() {
    const availW = stage.clientWidth - 44, availH = stage.clientHeight - 44;
    let w = Math.min(availW, availH * ratio);
    w = Math.max(160, Math.floor(w));
    slide.style.width = w + 'px';
    slide.style.height = Math.round(w / ratio) + 'px';
    return w;
  }

  async function bitmap(n, cssW) {
    const hit = cache.get(n);
    if (hit && hit.w >= cssW * 0.92) return hit.canvas;
    const page = await pdf.getPage(n);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = page.getViewport({ scale: cssW * dpr / base.width });
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    await page.render({ canvasContext: c.getContext('2d', { alpha: false }), viewport: vp }).promise;
    cache.set(n, { canvas: c, w: cssW });
    if (cache.size > 6) cache.delete(cache.keys().next().value);
    return c;
  }

  async function show(n, quiet) {
    n = Math.max(1, Math.min(total, n));
    cur = n; const my = ++token;
    $('num').textContent = n + ' / ' + total;
    $('rail').style.width = (n / total * 100) + '%';
    $('prev').disabled = n === 1; $('next').disabled = n === total;
    if (history.replaceState) history.replaceState(null, '', '#' + n);
    const w = fit();
    if (!quiet && !cache.has(n)) msg.textContent = '';
    try {
      const c = await bitmap(n, w);
      if (my !== token) return;
      cv.width = c.width; cv.height = c.height;
      cv.getContext('2d', { alpha: false }).drawImage(c, 0, 0);
      msg.textContent = '';
    } catch (e) { console.warn('render fail', n, e); }
    for (const k of [n + 1, n - 1]) if (k >= 1 && k <= total) bitmap(k, w).catch(() => {});
  }

  $('prev').addEventListener('click', () => show(cur - 1));
  $('next').addEventListener('click', () => show(cur + 1));
  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); show(cur + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); show(cur - 1); }
    else if (k === 'Home') { e.preventDefault(); show(1); }
    else if (k === 'End') { e.preventDefault(); show(total); }
    else if (k === 'Escape' && p) location.href = p;
  });

  let sx = null, sy = null;
  stage.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
    sx = null;
  }, { passive: true });

  let timer;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { cache.clear(); show(cur, true); }, 180);
  });

  const from = parseInt(location.hash.slice(1), 10);
  show(from >= 1 && from <= total ? from : 1);
}
</script>
</body>
</html>
